name: Build Android APK - Ultimate

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Project Zip Automatically
        run: |
          echo "Searching for ZIP archives..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No ZIP file found in the repository!"
            exit 1
          fi
          
          echo "Found ZIP file: $ZIP_FILE"
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # فك أي ملف زيب داخلي إن وجد تلقائياً
          INNER_ZIP=$(find extracted_project -name "*.zip" | head -n 1)
          if [ -n "$INNER_ZIP" ]; then
            echo "Found inner ZIP: $INNER_ZIP"
            unzip -q "$INNER_ZIP" -d extracted_project/inner_extracted
          fi

      - name: Locate Gradle & Build APK
        run: |
          echo "Locating gradlew script..."
          GRADLEW_PATH=$(find extracted_project -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found after extraction!"
            find extracted_project -maxdepth 3
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project root directory is: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          echo "Starting Gradle build (assembleDebug)..."
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarket-Fawry-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
