name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project files
        run: |
          # 1. فك ضغط الأرشيف الرئيسي
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting root zip: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d root_extracted

          # 2. البحث عن أي ملف zip داخلي وفك ضغطه إن وجد
          INNER_ZIP=$(find root_extracted -name "*.zip" | head -n 1)
          if [ -n "$INNER_ZIP" ]; then
            echo "Extracting inner zip: $INNER_ZIP"
            unzip -q "$INNER_ZIP" -d inner_extracted
          fi

          # 3. العثور على المجلد الذي يحتوي على gradlew ونقل المحتويات للمسار الرئيسي
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory at: $PROJECT_DIR"
          
          if [ "$PROJECT_DIR" != "." ]; then
            cp -r $PROJECT_DIR/* ./
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarket-Fawry-APK
          path: app/build/outputs/apk/debug/app-debug.apk
