name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Zip Automatically
        run: |
          ZIP_NAME=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found ZIP file: $ZIP_NAME"
          unzip -q "$ZIP_NAME" -d extracted_project
          
          # نقل محتويات المجلد المستخرج للمسار الرئيسي
          cp -r extracted_project/* ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find Project and Build APK
        run: |
          # العثور على مكان مجلد المشروع الذي يحتوي على gradlew والانتقال إليه
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project directory is: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarket-Fawry-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
